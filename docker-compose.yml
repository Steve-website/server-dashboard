services:
  dashboard:
    build: ./backend
    container_name: server-dashboard
    ports:
      - "8878:8000"
    environment:
      SSH_HOST: ${SSH_HOST:-192.168.1.154}
      SSH_PORT: ${SSH_PORT:-22}
      SSH_USER: ${SSH_USER:-steven}
      SSH_PASSWORD: ${SSH_PASSWORD:-}
      COLLECT_INTERVAL: ${COLLECT_INTERVAL:-5}
    restart: unless-stopped
